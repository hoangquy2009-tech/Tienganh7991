    <script>
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : null);
          if (!target) return;
          var _fetch = target.fetch ? target.fetch.bind(target) : undefined;
          var descriptor = {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(target, 'fetch', descriptor);
          } catch (e) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (e) {}
        } catch (err) {
          console.warn('Fetch setter shim error:', err);
        }
      })();
    </script>
